<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Page not found — Meridion AI</title>
  <meta name="description" content="The page you requested could not be found. Return to Meridion AI or explore our work.">
  <link rel="icon" href="meridion-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root{--night:#070b14;--paper:#efeee8;--ink:#090e19;--muted:#6c7078;--accent:#5865f2;--line:rgba(9,14,25,.18);--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:'Outfit',sans-serif;background:var(--paper);color:var(--ink)}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.shell{display:grid;min-height:100dvh;grid-template-rows:auto 1fr auto;padding:clamp(1.25rem,4vw,4rem)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:1rem}.brand{display:inline-flex;align-items:center;gap:.65rem;color:var(--ink);font-size:.82rem;font-weight:600;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}.brand img{width:34px;height:34px}.brand b{color:var(--accent)}
    .code{font:400 .62rem/1 'Space Mono',monospace;color:var(--muted);letter-spacing:.08em}.main{display:grid;align-content:center;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:clamp(3rem,10vw,10rem);padding:6rem 0}
    h1{max-width:11ch;margin:0;font-size:clamp(4.25rem,10vw,9.5rem);font-weight:500;letter-spacing:-.075em;line-height:.82;text-wrap:balance}h1 em{display:block;color:var(--accent);font-style:normal}.copy{align-self:end;border-top:1px solid var(--line);padding-top:1.4rem}.copy p{max-width:38ch;margin:0;color:var(--muted);font-size:1rem;line-height:1.6}
    .actions{display:flex;gap:.8rem;margin-top:2rem;flex-wrap:wrap}.actions a{display:inline-flex;min-height:48px;padding:.75rem 1rem;align-items:center;justify-content:center;border:1px solid var(--ink);color:var(--ink);font-size:.8rem;font-weight:600;text-decoration:none;transition:transform 180ms var(--ease),background 180ms var(--ease),color 180ms var(--ease)}.actions a:first-child{background:var(--ink);color:#fff}.foot{display:flex;justify-content:space-between;gap:1rem;padding-top:1.25rem;border-top:1px solid var(--line);color:var(--muted);font:400 .58rem/1.5 'Space Mono',monospace}.foot a{color:inherit}
    @media (hover:hover) and (pointer:fine){.actions a:hover{transform:translateY(-2px)}.actions a:first-child:hover{background:var(--accent);border-color:var(--accent)}}
    @media(max-width:720px){.main{grid-template-columns:1fr;align-content:center;gap:3.5rem;padding:5rem 0}.copy{align-self:auto}h1{font-size:clamp(4rem,21vw,6.5rem)}.foot{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){.actions a{transition:background 180ms ease,color 180ms ease}.actions a:hover{transform:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><a class="brand" href="index.html"><img src="meridion-logo.svg" alt=""><span>Meridion <b>AI</b></span></a><span class="code">404 / route not found</span></header>
    <section class="main" aria-labelledby="notFoundTitle">
      <h1 id="notFoundTitle">Wrong turn.<em>Clear next step.</em></h1>
      <div class="copy"><p>This address may have moved or no longer exists. Head back to the main site, or look through the work we have shipped.</p><div class="actions"><a href="index.html">Return home</a><a href="work.html">View our work</a></div></div>
    </section>
    <footer class="foot"><span>Meridion AI · Growth systems built with judgment.</span><span><a href="login.html">Client login</a> · <a href="privacy.html">Privacy</a></span></footer>
  </main>
</body>
</html>
