<!--
  Supabase → Authentication → Email Templates → "Confirm signup"
  Paste this whole block into the "Message body" field (HTML editor), then Save.
  Subject line field (above the body editor): Confirm your email — Meridion AI
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F4F8;padding:40px 16px;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #E4E7EE;">
        <tr>
          <td style="background:#0B0F19;padding:28px 32px;">
            <img src="https://meridionai.com/meridion-logo.svg" width="28" height="28" alt="" style="vertical-align:middle;border-radius:6px;">
            <span style="color:#F2F4F8;font-size:18px;font-weight:700;vertical-align:middle;margin-left:10px;">Meridion<span style="color:#8A74FF;">AI</span></span>
          </td>
        </tr>
        <tr>
          <td style="padding:36px 32px 8px;">
            <h1 style="margin:0 0 14px;font-size:22px;line-height:1.3;color:#0B0F19;">Confirm your email address</h1>
            <p style="margin:0 0 26px;font-size:15px;line-height:1.6;color:#4B5568;">
              Thanks for signing up. Click below to confirm your email and finish setting up your account.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="border-radius:6px;background:#4C59F7;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 28px;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:6px;">
                    Confirm Email Address
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:26px 0 0;font-size:13px;line-height:1.6;color:#8A93A6;">
              If you didn't create an account with Meridion AI, you can safely ignore this email.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 30px;border-top:1px solid #EEF0F5;">
            <p style="margin:0;font-size:12px;color:#8A93A6;">Meridion AI · meridionai.com</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
